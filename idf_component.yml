version: "0.2.0"
description: >
  Thin, transparent I2S microphone component for ESP-IDF v6.0.x, built on
  the modern i2s_std driver. Blocking one-buffer-per-call read from your
  own task, an honest overflow counter, and clean stop() semantics. No
  callbacks, no internal task, no buffering beyond the driver's own.
url: "https://github.com/embedblocks/i2s_mic.git"
dependencies:
  idf: ">=6.0,<6.1"
targets:
  - esp32
  - esp32s3
  - esp32c3
  - esp32c6
files:
  exclude:
    - "test/**"
    - "test_app/**"
    - "test_host/**"
    - "examples/loopback_example/**"
tags:
  - i2s
  - microphone
  - mic
  - audio
  - mems
  - inmp441
  - msm261
  - pdm-free
  - recording
  - dma