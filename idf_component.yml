version: "1.0.0"
description: >
  Task-free, ISR-driven I2S microphone component for ESP-IDF v6.0.x, built
  on the modern i2s_std driver. Application posts pre-allocated buffers;
  the component copies captured audio into them from ISR context and
  invokes an application callback. No internal FreeRTOS task.
url: "https://github.com/YOUR_ORG/i2s_mic"
dependencies:
  idf: ">=6.0,<6.1"
targets:
  - esp32
  - esp32s3
  - esp32c3
  - esp32c6
